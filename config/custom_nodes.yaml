# ======================================================================
# AI Video Studio - custom node manifest
# ----------------------------------------------------------------------
# The four CORE workflows (wan_text_to_video, wan_image_to_video,
# fast_preview, high_quality) use ONLY native ComfyUI nodes, so NO custom
# nodes are required for the default experience. Everything below is
# OPTIONAL and installed only when `required: true` or when a tier that
# needs it is selected (install_nodes.py handles this).
#
# Each node is pinned to an exact commit for reproducibility.
# ======================================================================

nodes:
  # Enables loading .gguf quantized diffusion models (UnetLoaderGGUF).
  # Needed only if you download the `gguf` model tier for low-VRAM GPUs.
  - key: comfyui_gguf
    name: ComfyUI-GGUF
    repo: https://github.com/city96/ComfyUI-GGUF.git
    commit: 6ea2651e7df6
    required: false
    needed_for_tiers: [gguf]
    pip_requirements: true    # has its own requirements.txt
    description: GGUF quantized model loader (low VRAM).

  # Extra video load/save/combine utilities. Native CreateVideo/SaveVideo
  # already cover MP4 export, so this is optional convenience only.
  - key: video_helper_suite
    name: ComfyUI-VideoHelperSuite
    repo: https://github.com/Kosinkadink/ComfyUI-VideoHelperSuite.git
    commit: 4d907bee61e9
    required: false
    needed_for_tiers: []
    pip_requirements: true
    description: Optional video utility nodes (not required by core workflows).
